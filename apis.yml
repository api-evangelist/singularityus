description: Singularity Defense Corp (operating on singularityus.com) is a defense-technology
  company building affordable, scalable counter-weapon air defense systems that protect
  warfighters and civilians from drones and low-cost, mass-produced munitions. Led by
  CEO Jack Oswald with COO Shail Giroux, the company is backed by Khosla Ventures, New
  Enterprise Associates, Andreessen Horowitz, Y Combinator, Menlo Ventures, and Felicis.
  It ships physical air-defense hardware and publishes no public API, developer portal,
  or developer documentation. Added to the API Evangelist network as a venture-portfolio
  lead; this enrichment pass confirmed the company has no public API surface.
